<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body class="roboto-style">
    <header class="header">
      <a href="img">
        <img
          class="img"
          src="images/logo.png"
          alt="image"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              class="nav__link is-active"
              href="apple"
            >
              APPLE
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="samsung"
            >
              SAMSUNG
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="smartphones"
            >
              SMARTPHONES
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="gadgets"
            >
              GADGETS
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="tables"
            >
              TABLETS
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="photo"
            >
              PHOTO
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="video"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
